[project]
name = "pdfdir"
dynamic = ["version"]
description = "Add table-of-contents bookmarks to PDF files"
readme = "readme.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "packaging>=24,<27",
    "pypdf[crypto]>=3.17,<7",
    "PySide6>=6.5,<7",
]

[project.urls]
Homepage = "https://github.com/chroming/pdfdir"
Issues = "https://github.com/chroming/pdfdir/issues"

[project.scripts]
pdfdir = "src.cli:main"

[project.gui-scripts]
pdfdir-gui = "src.gui.main:run"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
build = [
    "Pillow>=10",
    "pyinstaller>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/version.py"

[tool.hatch.build]
exclude = ["src/gui/en.qm"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"pdf.ico" = "src/pdf.ico"

[tool.pytest.ini_options]
testpaths = ["tests"]
