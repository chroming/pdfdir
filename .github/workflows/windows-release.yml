name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --locked --group build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Determine version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "__version__ = '${VERSION}'" > src/version.py

      - name: Build packages
        run: |
          uv run pyinstaller -F run_gui.py -i pdf.ico --add-data "pdf.ico;src" --add-data "src/language;src/language" --distpath . -n pdfdir --noconfirm --clean --noconsole
          uv run pyinstaller -D run_gui.py -i pdf.ico --add-data "pdf.ico;src" --add-data "src/language;src/language" --distpath . -n pdfdir_folder --noconfirm --clean --noconsole
          uv run pyinstaller -F run_gui.py -i pdf.ico --add-data "pdf.ico;src" --add-data "src/language;src/language" --distpath . -n pdfdir_debug --noconfirm --clean

      - name: Prepare archives
        run: |
          tar.exe -a -c -f pdfdir_win.zip pdfdir.exe
          tar.exe -a -c -f pdfdir_win_folder.zip pdfdir_folder
          tar.exe -a -c -f pdfdir_debug_win.zip pdfdir_debug.exe

      - name: Upload packages
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pdfdir_win.zip
            pdfdir_win_folder.zip
            pdfdir_debug_win.zip
