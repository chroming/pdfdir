name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-qt-deps.sh

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --locked

      - name: Run tests with branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
          uv run coverage xml

      - name: Require coverage for changed lines
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run diff-cover coverage.xml --compare-branch "origin/${{ github.base_ref }}" --fail-under=95

  minimum-dependencies:
    name: Python 3.9 / minimum dependencies
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install Linux Qt runtime dependencies
        run: bash .github/scripts/install-linux-qt-deps.sh

      - name: Install uv
        run: python -m pip install uv

      - name: Run minimum dependency tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --python 3.9 --with "pypdf[crypto]==3.17.4" --with "PySide6==6.5.3" coverage run -m pytest -q
          uv run --python 3.9 --with "pypdf[crypto]==3.17.4" --with "PySide6==6.5.3" coverage report

  package:
    name: Wheel and frozen GUI smoke tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system and project dependencies
        run: |
          bash .github/scripts/install-linux-qt-deps.sh
          python -m pip install uv
          uv sync --locked --group build

      - name: Build and inspect distributions
        run: |
          uv build
          uvx twine check dist/*
          uvx check-wheel-contents --ignore W005 dist/*.whl

      - name: Test installed wheel
        run: |
          uv venv "$RUNNER_TEMP/package-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/package-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/package-venv/bin/python" tests/package_smoke.py "$RUNNER_TEMP/package-smoke" "$RUNNER_TEMP/package-venv/bin/pdfdir"

      - name: Build and start frozen GUI
        run: |
          uv run pyinstaller -F run_gui.py -i "$GITHUB_WORKSPACE/pdf.ico" --add-data "$GITHUB_WORKSPACE/pdf.ico:src" --add-data "$GITHUB_WORKSPACE/src/language:src/language" --distpath "$RUNNER_TEMP/frozen" --workpath "$RUNNER_TEMP/pyinstaller-build" --specpath "$RUNNER_TEMP" -n pdfdir --noconfirm --clean --noconsole
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5s "$RUNNER_TEMP/frozen/pdfdir"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "Frozen GUI exited unexpectedly with status $STATUS"
            exit 1
          fi
